version: "3"

vars:
  OBSERVE_DIR: "{{.ROOT_DIR}}/k3s/observe"

tasks:
  _generic:
    internal: true
    silent: true
    dir: "{{.OBSERVE_DIR}}/{{.SERVICE}}"
    cmds:
      - echo "------------------------------"
      - echo "Applying {{.SERVICE}}"
      - echo "------------------------------"
      - kubectl apply -k .

  all:
    desc: Deploy observe layer
    silent: true
    cmds:
      - task: storage
      - echo ""
      - task: exporter-api
      - echo ""
      - task: exporter-mqtt
      - echo ""
      - task: exporter-snmp
      - echo ""
      - task: exporter-node
      - echo ""
      - task: kube-state-metrics
      - echo ""
      - task: victorialogs
      - echo ""
      - task: victoriametrics
      # - kubectl -n observe rollout status deployment/victoriametrics --timeout=180s
      - echo ""
      - task: vmagent
      - echo ""
      - task: grafana
      - echo ""
      - task: ntfy
      - echo ""
      - task: alertmanager
      - echo ""
      - task: vmalert

  storage:
    dir: "{{.OBSERVE_DIR}}"
    silent: true
    cmds:
      - echo "------------------------------"
      - echo "Applying storage configuration"
      - echo "------------------------------"
      - kubectl apply -f storage.yaml

  grafana:
    vars:
      SERVICE: grafana
    desc: Deploy {{.SERVICE}}
    cmds:
      - task: _generic
        vars:
          SERVICE: "{{.SERVICE}}"

  victoriametrics:
    vars:
      SERVICE: victoriametrics
    desc: Deploy {{.SERVICE}}
    cmds:
      - task: _generic
        vars:
          SERVICE: "{{.SERVICE}}"

  vmagent:
    vars:
      SERVICE: vmagent
    desc: Deploy {{.SERVICE}}
    cmds:
      - task: _generic
        vars:
          SERVICE: "{{.SERVICE}}"

  alertmanager:
    vars:
      SERVICE: alertmanager
    desc: Deploy {{.SERVICE}}
    cmds:
      - task: _generic
        vars:
          SERVICE: "{{.SERVICE}}"

  ntfy:
    vars:
      SERVICE: ntfy
    desc: Deploy {{.SERVICE}}
    cmds:
      - task: _generic
        vars:
          SERVICE: "{{.SERVICE}}"

  vmalert:
    vars:
      SERVICE: vmalert
    desc: Deploy {{.SERVICE}}
    cmds:
      - task: _generic
        vars:
          SERVICE: "{{.SERVICE}}"

  victorialogs:
    vars:
      SERVICE: victorialogs
    desc: Deploy {{.SERVICE}}
    cmds:
      - task: _generic
        vars:
          SERVICE: "{{.SERVICE}}"

  exporter-node:
    vars:
      SERVICE: exporter-node
    desc: Deploy {{.SERVICE}}
    cmds:
      - task: _generic
        vars:
          SERVICE: "{{.SERVICE}}"

  kube-state-metrics:
    vars:
      SERVICE: kube-state-metrics
    desc: Deploy {{.SERVICE}}
    cmds:
      - task: _generic
        vars:
          SERVICE: "{{.SERVICE}}"

  exporter-api:
    vars:
      SERVICE: exporter-api
    desc: Deploy {{.SERVICE}}
    cmds:
      - task: _generic
        vars:
          SERVICE: "{{.SERVICE}}"

  exporter-mqtt:
    vars:
      SERVICE: exporter-mqtt
    desc: Deploy {{.SERVICE}} (requires local .secrets/mqtt.env)
    cmds:
      - task: _generic
        vars:
          SERVICE: "{{.SERVICE}}"
           
  exporter-snmp:
    vars:
      SERVICE: exporter-snmp
    desc: Deploy {{.SERVICE}}
    cmds:
      - task: _generic
        vars:
          SERVICE: "{{.SERVICE}}"

