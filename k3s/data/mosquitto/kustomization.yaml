apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: data

resources:
  - deployment.yaml
  - service.yaml
  - storage.yaml

configMapGenerator:
  - name: mosquitto-config
    files:
      - mosquitto.conf=configs/mosquitto.conf

secretGenerator:
  - name: mosquitto-auth
    files:
      - passwords=.secrets/passwords
