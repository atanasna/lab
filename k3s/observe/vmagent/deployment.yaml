apiVersion: apps/v1
kind: Deployment
metadata:
  name: vmagent
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: vmagent
  template:
    metadata:
      labels:
        app: vmagent
    spec:
      securityContext:
        fsGroup: 65534
      serviceAccountName: vmagent
      containers:
        - name: vmagent
          image: victoriametrics/vmagent:v1.155.0
          args:
            - -promscrape.config=/etc/vmagent/prometheus.yaml
            - -remoteWrite.url=http://victoriametrics:8428/api/v1/write
            - -remoteWrite.tmpDataPath=/vmagent
            - -remoteWrite.maxDiskUsagePerURL=1GB
          ports:
            - name: http
              containerPort: 8429
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          volumeMounts:
            - name: config
              mountPath: /etc/vmagent
              readOnly: true
            - name: observe-pvc
              mountPath: /vmagent
              subPath: vmagent
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
      volumes:
        - name: config
          configMap:
            name: vmagent-config
        - name: observe-pvc
          persistentVolumeClaim:
            claimName: observe-pvc
