apiVersion: apps/v1
kind: Deployment
metadata:
  name: victorialogs
  labels:
    app: victorialogs
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: victorialogs
  template:
    metadata:
      labels:
        app: victorialogs
    spec:
      securityContext:
        fsGroup: 65534
      containers:
        - name: victorialogs
          image: victoriametrics/victoria-logs:latest
          args:
            - -storageDataPath=/victoria-logs-data
            - -retentionPeriod=7d
          ports:
            - name: http
              containerPort: 9428
              protocol: TCP
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /-/healthy
              port: http
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 10
          readinessProbe:
            httpGet:
              path: /-/ready
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 10
          volumeMounts:
            - name: observe-pvc
              mountPath: /victoria-logs-data
              subPath: victorialogs
      volumes:
        - name: observe-pvc
          persistentVolumeClaim:
            claimName: observe-pvc
