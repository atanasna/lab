apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: vlagent
  labels:
    app: vlagent
spec:
  selector:
    matchLabels:
      app: vlagent
  template:
    metadata:
      labels:
        app: vlagent
    spec:
      serviceAccountName: vlagent
      containers:
        - name: vlagent
          image: victoriametrics/vlagent:latest
          args:
            - -kubernetesCollector
            - -kubernetesCollector.excludeFilter=kubernetes.pod_name:=%{HOSTNAME}
            - -envflag.enable
            - -remoteWrite.url=http://victorialogs:9428/insert/native
            - -remoteWrite.maxDiskUsagePerURL=1073741824
            - -tmpDataPath=/var/lib/vlagent
          ports:
            - name: http
              containerPort: 9429
              protocol: TCP
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 250m
              memory: 256Mi
          volumeMounts:
            - name: varlog
              mountPath: /var/log
              readOnly: true
            - name: varlib
              mountPath: /var/lib
              readOnly: true
            - name: vlagent-data
              mountPath: /var/lib/vlagent
      tolerations:
        - effect: NoSchedule
          operator: Exists
      volumes:
        - name: varlog
          hostPath:
            path: /var/log
        - name: varlib
          hostPath:
            path: /var/lib
        - name: vlagent-data
          hostPath:
            path: /var/lib/vlagent
            type: DirectoryOrCreate
