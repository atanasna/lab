groups:
  - name: synology
    interval: 30s
    rules:
      ### Disk Status
      - record: alert_rule_target
        expr: 0 * diskStatus{job="synology-nas"} + 1
        labels:
          alertname: disk-status-not-ok
          severity: critical
          namespace: infra
          domain: nas
      - alert: disk-status-not-ok
        expr: diskStatus{job="synology-nas"} != 1
        for: 5m
        labels:
          severity: critical
          namespace: infra
          domain: nas
        annotations:
          summary: "Synology disk status is not OK on {{ $labels.instance }}"
          description: "{{ $labels.diskID }} reports disk status {{ $value }} for 5 minutes."

      ### Disk Health
      - record: alert_rule_target
        expr: 0 * diskHealthStatus{job="synology-nas"} + 1
        labels:
          alertname: disk-health-status-not-ok
          severity: critical
          namespace: infra
          domain: nas
      - alert: disk-health-status-not-ok
        expr: diskHealthStatus{job="synology-nas"} != 1
        for: 5m
        labels:
          severity: critical
          namespace: infra
          domain: nas
        annotations:
          summary: "Synology disk health is not OK on {{ $labels.instance }}"
          description: "{{ $labels.diskID }} reports disk health status {{ $value }} for 5 minutes."

      ### Volume Raid Status
      - record: alert_rule_target
        expr: 0 * raidStatus{job="synology-nas", raidName=~"Volume.*"} + 1
        labels:
          alertname: volume-raid-status-not-ok
          severity: critical
          namespace: infra
          domain: nas
      - alert: volume-raid-status-not-ok
        expr: raidStatus{job="synology-nas", raidName=~"Volume.*"} != 1
        for: 5m
        labels:
          severity: critical
          namespace: infra
          domain: nas
        annotations:
          summary: "Synology RAID status is not OK on {{ $labels.instance }}"
          description: "{{ $labels.raidName }} reports RAID status {{ $value }} for 5 minutes."

      ### System Temperature(High)
      - record: alert_rule_target
        expr: 0 * temperature{job="synology-nas"} + 1
        labels:
          alertname: system-temperature-high
          severity: warning
          namespace: infra
          domain: nas
      - alert: system-temperature-high
        expr: temperature{job="synology-nas"} > 50
        for: 5m
        labels:
          severity: warning
          namespace: infra
          domain: nas
        annotations:
          summary: "High Synology system temperature on {{ $labels.instance }}"
          description: "System temperature has been above 50 C for 5 minutes (current: {{ $value | printf \"%.1f\" }} C)."

      ### System Temperature(Critical)
      - record: alert_rule_target
        expr: 0 * temperature{job="synology-nas"} + 1
        labels:
          alertname: system-temperature-critical
          severity: critical
          namespace: infra
          domain: nas
      - alert: system-temperature-critical
        expr: temperature{job="synology-nas"} > 60
        for: 5m
        labels:
          severity: critical
          namespace: infra
          domain: nas
        annotations:
          summary: "Critical Synology system temperature on {{ $labels.instance }}"
          description: "System temperature has been above 60 C for 5 minutes (current: {{ $value | printf \"%.1f\" }} C)."
