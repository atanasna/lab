apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: observe

resources:
  - deployment.yaml
  - service.yaml

configMapGenerator:
  - name: mqtt-exporter-config
    files:
      - telegraf.conf=configs/telegraf.conf

secretGenerator:
  - name: mqtt-exporter-auth
    envs:
      - .secrets/mqtt.env
