[agent]
  omit_hostname = true
  flush_interval = "5s"

[[inputs.mqtt_consumer]]
  servers = ["tcp://mosquitto.data.svc.cluster.local:1883"]
  topics = ["voyager/+/ht/events/rpc"]
  username = "${MQTT_USERNAME}"
  password = "${MQTT_PASSWORD}"
  client_id = "shelly-metrics-exporter"
  qos = 1
  persistent_session = true
  topic_tag = ""
  data_format = "json_v2"

  [[inputs.mqtt_consumer.topic_parsing]]
    topic = "voyager/+/ht/events/rpc"
    tags = "site/floor/_/_/_"

  [[inputs.mqtt_consumer.json_v2]]
    measurement_name = "shelly_ht"

    [[inputs.mqtt_consumer.json_v2.tag]]
      path = "src"
      rename = "sensor"

    [[inputs.mqtt_consumer.json_v2.field]]
      path = "params.temperature:0.tC"
      rename = "temperature_celsius"
      type = "float"
      optional = true

    [[inputs.mqtt_consumer.json_v2.field]]
      path = "params.humidity:0.rh"
      rename = "humidity_percent"
      type = "float"
      optional = true

    [[inputs.mqtt_consumer.json_v2.field]]
      path = "params.devicepower:0.battery.percent"
      rename = "battery_percent"
      type = "float"
      optional = true

    [[inputs.mqtt_consumer.json_v2.field]]
      path = "params.ts"
      rename = "last_report_timestamp_seconds"
      type = "float"
      optional = true

[[outputs.prometheus_client]]
  listen = ":9273"
  # shortcut: cache readings for the sensor's two-hour sleep cycle; adjust if reporting changes.
  expiration_interval = "3h"
  export_timestamp = false
  collectors_exclude = ["gocollector", "process"]
